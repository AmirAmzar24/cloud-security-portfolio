name: Security Scan

on: [push, pull_request]

permissions:
  contents: read

jobs:
  iac-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          soft_fail: false

  aws-auth:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Debug OIDC claims (temporary)
        run: |
          IDTOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')
          IDTOKEN="$IDTOKEN" python3 -c 'import os,json,base64; p=os.environ["IDTOKEN"].split(".")[1]; p+="="*(-len(p)%4); c=json.loads(base64.urlsafe_b64decode(p.encode())); print("repository =", c.get("repository")); print("repository_id =", c.get("repository_id")); print("repository_owner =", c.get("repository_owner")); print("repository_owner_id =", c.get("repository_owner_id"))'

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::640168411629:role/GithubActionsDeploymentRole
          aws-region: ap-southeast-1

      - name: Verify OIDC auth (zero stored keys)
        run: aws sts get-caller-identity