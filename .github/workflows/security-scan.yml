name: Security Scan

on: [push, pull_request]

permissions:
  contents: read

jobs:
  iac-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          soft_fail: false

  aws-auth:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::640168411629:role/GithubActionsDeploymentRole
          aws-region: ap-southeast-1

      - name: Verify OIDC auth (zero stored keys)
        run: aws sts get-caller-identity